# Workflow 模板：Flutter
# =============================================================================
# 适用项目：Flutter 跨平台应用（示例同时覆盖 iOS 与 Android 构建）。
#
# 一键复制方法：
#   1. 将本文件复制到你的仓库 .github/workflows/flutter.yml
#   2. 按需修改 platform（ios/android/all）、build-mode
#   3. push 到 main 分支（或发起 PR）即可触发
#
# 环境说明：
# - Macrunara 节点已预装 Flutter 3.47.2 stable（~/flutter），复制即用；
# - 构建使用 macrunara/build-actions/flutter：pub get → analyze → test →
#   build ipa（无签名）/ build apk，自动把预装 Flutter 写入 PATH。
# =============================================================================

name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-flutter:
    # 标准标签写法：[macos, arm64, macrunara]
    # 禁止写 self-hosted / macos-latest 等节点未上报的标签，否则任务永远排队
    runs-on: [macos, arm64, macrunara]

    steps:
      # Step 1: 检出代码
      - uses: actions/checkout@v5

      # Step 2（可选）: Macrunara Setup Action
      - uses: macrunara/setup-action@v1
        with:
          installation-id: ${{ secrets.MACRUNARA_INSTALLATION_ID }}
          region: auto

      # 可选：锁定 Flutter 版本（节点已预装 stable，默认不需要）
      # - name: Setup Flutter
      #   uses: subosito/flutter-action@v2
      #   with:
      #     flutter-version: '3.24.0'
      #     channel: stable

      # Step 3: 打印环境信息（便于排障）
      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"

      # Step 4: 分析 + 测试 + 构建 + 上传
      # ----------------------------------
      # platform=all：analyze + test + ipa（无签名）+ apk；
      # 只要单端就改 ios 或 android。run-tests: 'false' 可跳过 analyze/test。
      - name: Flutter Build & Upload
        uses: macrunara/build-actions/flutter@v1
        with:
          platform: all
          build-mode: release
          run-tests: 'true'
          upload_artifact: true
          artifact_name: flutter-build-products
