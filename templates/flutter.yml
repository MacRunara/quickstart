# Workflow template: Flutter
# =============================================================================
# Best for: Flutter cross-platform apps (this example covers both iOS and
# Android builds).
#
# How to use:
#   1. Copy this file to .github/workflows/flutter.yml in your repo
#   2. Comment out the iOS or Android build line if you only need one platform
#   3. Push to the main branch (or open a PR) to trigger a build
#
# Environment notes:
# - Macrunara nodes ship with Flutter 3.47.2 stable preinstalled (~/flutter)
#   — ready to use out of the box; the "Setup PATH" step below puts the
#   preinstalled tools on PATH, no installation needed.
# =============================================================================

name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-flutter:
    # Standard label: [macos, arm64, macrunara]
    # Do NOT use labels the nodes don't report (e.g. self-hosted, macos-latest),
    # or your job will stay queued forever.
    runs-on: [macos, arm64, macrunara]

    steps:
      # Step 1: Checkout
      - uses: actions/checkout@v5

      # Optional: pin a Flutter version (nodes already ship stable; usually not needed)
      # - name: Setup Flutter
      #   uses: subosito/flutter-action@v2
      #   with:
      #     flutter-version: '3.24.0'
      #     channel: stable

      # Step 2: Add preinstalled tools to PATH (no installation needed)
      - name: Setup PATH
        run: |
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      # Step 3: Print environment info (helps troubleshooting)
      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"

      # Step 4: Analyze + test + build + upload
      # ----------------------------------
      # Drop the "Flutter Analyze & Test" step to skip analyze/test;
      # comment out one build line if you only need a single platform.
      - name: Flutter Analyze & Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build IPA (unsigned) & APK
        run: |
          flutter build ipa --release --no-codesign
          flutter build apk --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-products
          path: |
            build/ios/ipa/*.ipa
            build/app/outputs/flutter-apk/app-release.apk
