# Workflow template: React Native
# =============================================================================
# Best for: React Native apps (this example covers JS tests + iOS native build).
#
# How to use:
#   1. Copy this file to .github/workflows/react-native.yml in your repo
#   2. Adjust the iOS workspace/scheme names and package manager (npm / yarn)
#   3. Push to the main branch (or open a PR) to trigger a build
#
# Environment notes:
# - Macrunara nodes ship with Node 20 LTS + yarn + CocoaPods 1.17 +
#   JDK 17 + Android SDK (API 35 + NDK 27) preinstalled — copy and go;
#   the "Setup PATH" step puts preinstalled tools (pod / node) on PATH.
# =============================================================================

name: React Native CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-react-native:
    # Standard label: [macos, arm64, macrunara]
    # Do NOT use labels the nodes don't report (e.g. self-hosted, macos-latest),
    # or your job will stay queued forever.
    runs-on: [macos, arm64, macrunara]

    steps:
      # Step 1: Checkout
      - uses: actions/checkout@v5

      # Optional: pin a Node version (nodes already ship 20; usually not needed)
      # - name: Setup Node.js
      #   uses: actions/setup-node@v5
      #   with:
      #     node-version: '20'

      # Step 2: Add preinstalled tools to PATH (no installation needed)
      - name: Setup PATH
        run: |
          echo "/usr/local/bin" >> $GITHUB_PATH

      # Step 3: Print environment info (helps troubleshooting)
      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"

      # Step 4: Dependencies + test + build + upload
      # ----------------------------------
      # Set ios-workspace / ios-scheme to your project's actual paths;
      # add your own gradlew step for Android builds (see the android-gradle
      # template); drop the Jest step to skip tests.
      - name: Install dependencies
        run: |
          npm ci
          if [ -f ios/Podfile ]; then (cd ios && pod install); fi

      - name: Jest
        run: npm test -- --ci

      - name: Build iOS (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/MyApp.xcworkspace -scheme MyApp \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rn-ios-app
          path: ios/build/
