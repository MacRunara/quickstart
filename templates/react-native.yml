# Workflow 模板：React Native
# =============================================================================
# 适用项目：React Native 应用（示例覆盖 JS 测试与 iOS 原生构建）。
#
# 一键复制方法：
#   1. 将本文件复制到你的仓库 .github/workflows/react-native.yml
#   2. 按需修改 iOS workspace/scheme 名、包管理器（npm / yarn）
#   3. push 到 main 分支（或发起 PR）即可触发
#
# 环境说明：
# - Macrunara 节点已预装 Node 20 LTS + yarn + CocoaPods 1.17 +
#   JDK 17 + Android SDK（API 35 + NDK 27），复制即用；
# - 构建使用 macrunara/build-actions/react-native：npm ci|yarn →
#   pod install（有 ios/Podfile 时）→ jest → xcodebuild 模拟器构建，
#   自动把 node/pod 等预装工具写入 PATH。
# =============================================================================

name: React Native CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-react-native:
    # 标准标签写法：[macos, arm64, macrunara]
    # 禁止写 self-hosted / macos-latest 等节点未上报的标签，否则任务永远排队
    runs-on: [macos, arm64, macrunara]

    steps:
      # Step 1: 检出代码
      - uses: actions/checkout@v4

      # Step 2（可选）: Macrunara Setup Action
      - uses: macrunara/setup-action@v1
        with:
          installation-id: ${{ secrets.MACRUNARA_INSTALLATION_ID }}
          region: auto

      # 可选：锁定 Node 版本（节点已预装 20，默认不需要）
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      # Step 3: 打印环境信息（便于排障）
      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"

      # Step 4: 依赖 + 测试 + 构建 + 上传
      # ----------------------------------
      # package-manager 按项目选 npm 或 yarn；
      # ios-workspace/ios-scheme 改成你项目的实际路径与名称；
      # 需要 Android 构建时加 android-task: assembleDebug；
      # run-tests: 'false' 可跳过 jest。
      - name: RN Build & Upload
        uses: macrunara/build-actions/react-native@v1
        with:
          package-manager: npm
          ios-workspace: ios/MyApp.xcworkspace
          ios-scheme: MyApp
          # android-task: assembleDebug
          run-tests: 'true'
          upload_artifact: true
          artifact_name: rn-ios-app
