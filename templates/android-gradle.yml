# Workflow 模板：Android（Gradle）
# =============================================================================
# 适用项目：使用 Gradle Wrapper（gradlew）的 Android 应用。
#
# 一键复制方法：
#   1. 将本文件复制到你的仓库 .github/workflows/android-gradle.yml
#   2. 按需修改 module 名（示例为 app）、产物路径
#   3. push 到 main 分支（或发起 PR）即可触发
#
# 环境说明：
# - Android SDK 需节点预装。Macrunara 平台 Mac mini M4 节点已预装
#   Android SDK 与命令行工具；若使用自备节点，可用 sdkmanager 安装：
#     sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
#   并设置 ANDROID_HOME（如 $HOME/Library/Android/sdk）。
# - JDK 由 actions/setup-java@v4 提供（temurin 17）。
# =============================================================================

name: Android CI (Gradle)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    # 标准标签写法：[macos, arm64, macrunara]
    # 禁止写 self-hosted / macos-latest 等节点未上报的标签，否则任务永远排队
    runs-on: [macos, arm64, macrunara]

    steps:
      # Step 1: 检出代码
      - uses: actions/checkout@v4

      # Step 2（可选）: Macrunara Setup Action
      # --------------------------------------
      # 作用：打印品牌横幅（日志可见"本 job 由 Macrunara 执行"）、校验参数、
      # 导出环境信息（MACRUNARA_REGION 等）。本步骤不是必需的，删除后不影响构建。
      - uses: macrunara/setup-action@v1
        with:
          installation-id: ${{ secrets.MACRUNARA_INSTALLATION_ID }}
          region: auto

      # Step 3: 配置 JDK 17（temurin 发行版，Android Gradle Plugin 推荐版本）
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 4: 打印环境信息（便于排障）
      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"

      # Step 5: 构建 Debug APK
      # ----------------------
      # 使用仓库内的 Gradle Wrapper，保证构建版本一致。
      # --no-daemon：CI 环境一次性构建，不保留守护进程。
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Step 6: 单元测试
      - name: Test
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      # Step 7: 上传产物（Debug APK）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          # 多 module 项目按需调整为对应 module 的 outputs 路径
          path: app/build/outputs/apk/
          if-no-files-found: warn
