# Workflow template: iOS (xcodebuild)
# =============================================================================
# Best for: iOS apps with an Xcode project (.xcodeproj / .xcworkspace).
#
# How to use:
#   1. Copy this file to .github/workflows/ios-xcodebuild.yml in your repo
#   2. Adjust the scheme and project/workspace path
#   3. Push to the main branch (or open a PR) to trigger a build
#
# Environment notes:
# - Macrunara nodes are standard Apple Silicon M4 macOS machines with
#   Xcode 26.x + CLT preinstalled — nothing to install in-job.
# =============================================================================

name: iOS CI (xcodebuild)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-ios:
    # Standard label: [macos, arm64, macrunara]
    # Do NOT use labels the nodes don't report (e.g. self-hosted, macos-latest),
    # or your job will stay queued forever.
    runs-on: [macos, arm64, macrunara]

    steps:
      # Step 1: Checkout
      - uses: actions/checkout@v5

      # Step 2: Print environment info (helps troubleshooting)
      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          xcodebuild -version

      # Step 3: Build + archive + upload
      # ----------------------------------
      # Adjust configuration/sdk for your project; with a .xcworkspace pass its
      # path to -workspace instead of -project.
      # To verify compilation only, replace `archive` with `build` and drop
      # -archivePath. CI does not sign code (CODE_SIGNING_ALLOWED=NO); the
      # xcarchive is uploaded as-is — extend with your own signing steps for
      # TestFlight / other distribution.
      - name: Build & Archive
        run: |
          set -o pipefail
          xcodebuild -scheme MyApp -project MyApp.xcodeproj \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/MyApp.xcarchive archive

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-products
          path: build/
